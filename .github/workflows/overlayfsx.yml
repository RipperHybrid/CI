name: Overlayfsx CI

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'Source repo'
        required: false
        default: 'RipperHybrid/sbx'
      target_branch:
        description: 'Branch'
        required: false
        default: 'ExFsx'
      target_commit:
        description: 'Commit SHA (optional, overrides branch)'
        required: false
        default: ''
      cleanup_keep:
        description: 'Completed runs to keep'
        required: false
        default: '0'
      tag:
        description: 'Build tag'
        type: choice
        required: true
        default: 'dev'
        options:
          - dev
          - release

permissions:
  contents: read

env:
  SOURCE_REPO: ${{ github.event.inputs.source_repo || 'RipperHybrid/sbx' }}
  TARGET_BRANCH: ${{ github.event.inputs.target_branch || 'Exfsx' }}
  TARGET_COMMIT: ${{ github.event.inputs.target_commit || '' }}
  CLEANUP_KEEP: ${{ github.event.inputs.cleanup_keep || '0' }}
  BUILD_TAG: ${{ github.event.inputs.tag || 'dev' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout runner
        uses: actions/checkout@v4

      - name: Checkout source
        id: src
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.TARGET_COMMIT != '' && env.TARGET_COMMIT || env.TARGET_BRANCH }}
          token: ${{ secrets.GHTOKEN }}
          fetch-depth: 0
          path: src

      - name: Start timer
        run: date +%s > /tmp/build_start_ts

      - name: Metadata
        id: metadata
        working-directory: src
        env:
          TARGET_COMMIT: ${{ env.TARGET_COMMIT }}
        run: |
          PROP_FILE=$(find . -type f -name "module.prop" ! -path "*/target/*" | head -n 1)
          [ -z "$PROP_FILE" ] && { echo "module.prop not found"; exit 1; }
          python3 ../release.py metadata --module-prop "$PROP_FILE" --prefix Meta-Overlayfsx

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        working-directory: src
        run: |
          rustup update stable
          rustup target add aarch64-linux-android
          rustup target add x86_64-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          cache-targets: false

      - name: Install cross
        working-directory: src
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        working-directory: src
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Create Zip
        working-directory: src
        run: |
          cd target/module
          zip -r "../../../${{ steps.metadata.outputs.filename }}" .

      - name: Write metadata
        if: ${{ always() && steps.src.outcome == 'success' }}
        working-directory: src
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          FILENAME: ${{ steps.metadata.outputs.filename }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          NAME: Overlayfsx
          TAG: ${{ env.BUILD_TAG }}
          BRANCH: ${{ env.TARGET_BRANCH }}
          SOURCE_REPO: ${{ env.SOURCE_REPO }}
        run: |
          jq -n \
            --arg commit_msg "$(git log -1 --pretty=%B)" \
            --arg commit_hash "$(git rev-parse HEAD)" \
            --arg commit_short "$(git rev-parse --short HEAD)" \
            --arg commit_no "$(git rev-list --count HEAD)" \
            --arg run_number "$RUN_NUMBER" \
            --arg run_id "$RUN_ID" \
            --arg version "$VERSION" \
            --arg name "$NAME" \
            --arg tag "$TAG" \
            --arg branch "$BRANCH" \
            --arg source_repo "$SOURCE_REPO" \
            --arg filename "$FILENAME" \
            '{commit_msg: $commit_msg, commit_hash: $commit_hash, commit_short: $commit_short, commit_no: $commit_no, run_number: $run_number, run_id: $run_id, version: $version, name: $name, tag: $tag, branch: $branch, source_repo: $source_repo, filename: $filename}' \
            > "$GITHUB_WORKSPACE/metadata.json"

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            ${{ steps.metadata.outputs.filename }}
            metadata.json
          if-no-files-found: ignore
          overwrite: true
          compression-level: 0
          retention-days: 14

      - name: Dispatch Cleanup
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GHTOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
          KEEP: ${{ env.CLEANUP_KEEP }}
          RELEASE: ${{ steps.src.outcome == 'success' && 'true' || 'false' }}
        run: |
          gh workflow run cleanup.yml --repo "$REPO" \
            -f "repo=$REPO" \
            -f "run_id=$RUN_ID" \
            -f "branch=$REF" \
            -f "keep=$KEEP" \
            -f "release=$RELEASE" \
          || echo "::warning::cleanup dispatch failed (build unaffected)"
