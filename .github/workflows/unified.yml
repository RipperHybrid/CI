name: Unified CI

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Source Repo'
        type: choice
        required: true
        default: 'RipperHybrid/sbx'
        options:
          - RipperHybrid/AppSniper
          - RipperHybrid/sbx
          - RipperHybrid/custom
      branch:
        description: 'Branch'
        type: choice
        required: true
        default: 'ExLooper'
        options:
          - ExBlocker
          - ExLooper
          - ExCraft
          - Exfsx
          - Master
          - custom
      custom_repo:
        description: 'For repo=custom only (repo name or owner/repo)'
        required: false
        default: ''
      custom_branch:
        description: 'For branch=custom only'
        required: false
        default: ''
      target_commit:
        description: 'SHA (overrides branch)'
        required: false
        default: ''
      cleanup_keep:
        description: 'Runs to keep'
        required: false
        default: '0'
      prefix:
        description: 'Name (default: module.prop name)'
        required: false
        default: ''
      tag:
        description: 'Build tag'
        type: choice
        required: true
        default: 'dev'
        options:
          - dev
          - release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout runner
        uses: actions/checkout@v4

      - name: Resolve inputs
        id: resolve
        env:
          IN_REPO: ${{ inputs.repo }}
          IN_CUSTOM_REPO: ${{ inputs.custom_repo }}
          IN_BRANCH: ${{ inputs.branch }}
          IN_CUSTOM_BRANCH: ${{ inputs.custom_branch }}
          IN_PREFIX: ${{ inputs.prefix }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          if [ "$IN_REPO" = "RipperHybrid/custom" ]; then
            REPO="$IN_CUSTOM_REPO"
            if [ -z "$REPO" ]; then
              echo "::error::repo=custom selected but custom_repo is empty"
              exit 1
            fi
          else
            REPO="$IN_REPO"
          fi

          REPO="${REPO#https://github.com/}"
          REPO="${REPO#http://github.com/}"
          REPO="${REPO%.git}"
          REPO="${REPO#/}"
          REPO="${REPO%/}"

          case "$REPO" in
            */*) ;;
            *) REPO="${OWNER}/${REPO}" ;;
          esac

          if [ "$IN_BRANCH" = "custom" ]; then
            BRANCH="$IN_CUSTOM_BRANCH"
            if [ -z "$BRANCH" ]; then
              echo "::error::branch=custom selected but custom_branch is empty"
              exit 1
            fi
          else
            BRANCH="$IN_BRANCH"
          fi

          echo "SOURCE_REPO=$REPO" >> "$GITHUB_ENV"
          echo "TARGET_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "PREFIX=$IN_PREFIX" >> "$GITHUB_ENV"
          echo "repo:   $REPO"
          echo "branch: $BRANCH"
          echo "prefix: $IN_PREFIX"

      - name: Checkout source
        id: src
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.target_commit != '' && inputs.target_commit || env.TARGET_BRANCH }}
          token: ${{ secrets.GHTOKEN }}
          fetch-depth: 0
          path: src

      - name: Start timer
        run: date +%s > /tmp/build_start_ts

      - name: Metadata
        id: metadata
        working-directory: src
        env:
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: |
          PROP_FILE=$(find . -type f -name "module.prop" ! -path "*/target/*" | head -n 1)
          if [ -z "$PROP_FILE" ]; then
            echo "::error::module.prop not found"
            exit 1
          fi
          python3 ../release.py metadata --module-prop "$PROP_FILE" --prefix "${PREFIX}"

      - name: Pre-build hook
        if: hashFiles('src/.github/build.sh') != ''
        working-directory: src
        run: |
          chmod +x .github/build.sh
          ./.github/build.sh

      - name: Build ZIP
        working-directory: src
        run: |
          set -euo pipefail

          ZIP_NAME="${{ steps.metadata.outputs.filename }}"
          OUT_ZIP="../${ZIP_NAME}"
          STAGE="$(mktemp -d)"
          echo "Staging: $STAGE"

          FALLBACK=(META-INF webroot customize.sh post-fs-data.sh module.prop uninstall.sh service.sh)

          if [ -d ".github/_stage" ]; then
            echo "-> Using .github/_stage (build.sh output)"
            cp -a .github/_stage/. "$STAGE/"
            ( cd "$STAGE" && zip -r -q "$OLDPWD/$OUT_ZIP" . )
            echo "ZIP: $OUT_ZIP ($(du -h "$OUT_ZIP" | cut -f1))"
            exit 0
          fi

          PACK_LIST=()
          if [ -f ".github/pack.txt" ]; then
            echo "-> Using .github/pack.txt"
            while IFS= read -r line || [ -n "$line" ]; do
              line="${line%$'\r'}"
              line="$(echo "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              [ -z "$line" ] && continue
              case "$line" in
                \#*) continue ;;
              esac
              PACK_LIST+=("$line")
            done < .github/pack.txt
          else
            echo "-> No .github/pack.txt, using fallback list"
            PACK_LIST=("${FALLBACK[@]}")
          fi

          if [ ${#PACK_LIST[@]} -eq 0 ]; then
            echo "::error::pack list is empty"
            exit 1
          fi

          echo "Pack entries (${#PACK_LIST[@]}):"
          printf '  - %s\n' "${PACK_LIST[@]}"

          MISSING=()
          COPIED=()
          for entry in "${PACK_LIST[@]}"; do
            case "$entry" in
              /*|..|../*|*/..|*/../*)
                echo "::warning::skipping unsafe path '$entry'"
                MISSING+=("$entry")
                continue
                ;;
            esac

            if [ -e "$entry" ]; then
              mkdir -p "$STAGE/$(dirname "$entry")"
              cp -a "$entry" "$STAGE/"
              COPIED+=("$entry")
            else
              echo "::warning::missing '$entry' (skipping)"
              MISSING+=("$entry")
            fi
          done

          if [ ${#COPIED[@]} -eq 0 ]; then
            echo "::error::none of the pack entries exist - refusing to publish empty zip"
            printf '  - %s\n' "${PACK_LIST[@]}"
            exit 1
          fi

          echo ""
          echo "Copied ${#COPIED[@]} / ${#PACK_LIST[@]} entries."
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "Missing (skipped): ${MISSING[*]}"
          fi

          ( cd "$STAGE" && zip -r -q "$OLDPWD/$OUT_ZIP" . )
          echo "ZIP: $OUT_ZIP ($(du -h "$OUT_ZIP" | cut -f1))"

      - name: Write metadata
        if: ${{ always() && steps.src.outcome == 'success' }}
        working-directory: src
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          FILENAME: ${{ steps.metadata.outputs.filename }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          NAME_PREFIX: ${{ env.PREFIX }}
          META_NAME: ${{ steps.metadata.outputs.name }}
          TAG: ${{ inputs.tag }}
          BRANCH: ${{ env.TARGET_BRANCH }}
          SOURCE_REPO: ${{ env.SOURCE_REPO }}
        run: |
          NAME="$NAME_PREFIX"
          if [ -z "$NAME" ]; then
            NAME="$META_NAME"
          fi
          jq -n \
            --arg commit_msg "$(git log -1 --pretty=%B)" \
            --arg commit_hash "$(git rev-parse HEAD)" \
            --arg commit_short "$(git rev-parse --short HEAD)" \
            --arg commit_no "$(git rev-list --count HEAD)" \
            --arg run_number "$RUN_NUMBER" \
            --arg run_id "$RUN_ID" \
            --arg version "$VERSION" \
            --arg name "$NAME" \
            --arg tag "$TAG" \
            --arg branch "$BRANCH" \
            --arg source_repo "$SOURCE_REPO" \
            --arg filename "$FILENAME" \
            '{commit_msg: $commit_msg, commit_hash: $commit_hash, commit_short: $commit_short, commit_no: $commit_no, run_number: $run_number, run_id: $run_id, version: $version, name: $name, tag: $tag, branch: $branch, source_repo: $source_repo, filename: $filename}' \
            > "$GITHUB_WORKSPACE/metadata.json"

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            ${{ steps.metadata.outputs.filename }}
            metadata.json
          if-no-files-found: ignore
          overwrite: true
          compression-level: 0
          retention-days: 14

      - name: Dispatch Cleanup
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GHTOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
          KEEP: ${{ inputs.cleanup_keep }}
          RELEASE: ${{ steps.src.outcome == 'success' && 'true' || 'false' }}
        run: |
          gh workflow run cleanup.yml --repo "$REPO" \
            -f "repo=$REPO" \
            -f "run_id=$RUN_ID" \
            -f "branch=$REF" \
            -f "keep=$KEEP" \
            -f "release=$RELEASE" \
          || echo "::warning::cleanup dispatch failed (build unaffected)"
